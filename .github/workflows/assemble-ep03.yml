name: Assemble EP03 Video
on:
  push:
    branches:
      - media/reels-v3-ep01-03-20261118
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reassemble exact EP03 MP4 and verify SHA-256
        run: |
          set -euo pipefail
          dir="reels/2026-11-18-v3"
          cat "$dir/EP03_part0.bin" "$dir/EP03_part1.bin" > "$dir/BidMate_EP03_Reel_V3_STABLE_1080x1920.mp4"
          printf '%s  %s\n' "12eed4f481772ff57b33fbd6bf4e829a2b23ea25b099d081216463dace625c94" "$dir/BidMate_EP03_Reel_V3_STABLE_1080x1920.mp4" | sha256sum --check
          git rm -- "$dir/EP03_part0.bin" "$dir/EP03_part1.bin"
          git add "$dir/BidMate_EP03_Reel_V3_STABLE_1080x1920.mp4"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "assets: assemble and verify EP03 V3 exact MP4"
          git push origin HEAD:refs/heads/media/reels-v3-ep01-03-20261118
